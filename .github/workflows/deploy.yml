name: Siteyi yayınla

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Sunucuda API klasörlerini oluştur
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 <<'PY'
          import ftplib
          import os
          import time

          ftp = ftplib.FTP()
          ftp.connect(os.environ["FTP_SERVER"], 21, timeout=120)
          ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
          ftp.set_pasv(True)

          for folder in ("api", "api/data", "api/cache"):
              try:
                  ftp.mkd(folder)
              except ftplib.error_perm:
                  pass

          ftp.quit()
          time.sleep(2)
          PY

      - name: FTP ile sunucuya yükle
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          timeout: 600000
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/public_html/' }}
          log-level: verbose
          exclude: |
            **/.git*
            **/.github/**
            **/.env*
            **/.DS_Store
            **/README.md
            **/_revise_articles.py
            **/data/**
            api/lib/local-config.php
            api/cache/**
            api/data/**
            !api/data/stories-published.json
